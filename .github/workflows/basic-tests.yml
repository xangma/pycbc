name: basic tests

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 60
      matrix:
        os: [ubuntu-24.04]
        python-version: ['3.11', '3.12', '3.13']
        test-type: [unittest, search, docs]
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
      with:
        pixi-version: latest

    - name: Inject Python Version
      run: |
        pixi add python="${{ matrix.python-version }}.*"

    - name: Cache LAL auxiliary data files
      id: cache-lal-aux-data
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        key: lal-aux-data
        path: ~/lal_aux_data

    - if: ${{ steps.cache-lal-aux-data.outputs.cache-hit != 'true' }}
      name: Download LAL auxiliary data files
      run: |
        mkdir -p ~/lal_aux_data
        curl --fail --location --retry 3 --show-error --silent \
          --output-dir ~/lal_aux_data \
          --remote-name https://zenodo.org/records/14999310/files/SEOBNRv4ROM_v2.0.hdf5 \
          --remote-name https://zenodo.org/records/14999310/files/SEOBNRv4ROM_v3.0.hdf5

    - name: Cache example GW data
      id: cache-example-gw-data
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        key: example-gw-data
        path: |
          docs/_include/*_TDI_v2.gwf
          docs/_include/*_GWOSC_4KHZ_R1-1126257415-4096.gwf
          docs/_include/*_LOSC_CLN_4_V1-1187007040-2048.gwf
          examples/inference/lisa_smbhb_ldc/*_psd.txt
          examples/inference/lisa_smbhb_ldc/*_TDI_v2.gwf
          examples/inference/lisa_smbhb_ldc/MBHB_params_v2_LISA_frame.pkl
          examples/inference/margtime/*.gwf
          examples/inference/multisignal/*.gwf
          examples/inference/relative/*.gwf
          examples/inference/relmarg/*.gwf
          examples/inference/single/*.gwf

    - name: run pycbc test suite
      run: |
        export LAL_DATA_PATH=$HOME/lal_aux_data
        pixi run -e ${{matrix.test-type}} test-${{matrix.test-type}}

    - name: run focused CPU Torch test suite
      if: matrix.test-type == 'unittest'
      env:
        PYCBC_TEST_SCHEME: torch:cpu
      run: |
        export LAL_DATA_PATH=$HOME/lal_aux_data
        pixi run -e unittest test-unittest -q \
          test/test_scheme_runtime.py \
          test/test_fft_cli_wisdom.py \
          test/test_torch_optional.py \
          test/test_array_torch_reductions.py \
          test/test_torch_backend_protocol.py \
          test/test_torch_backend_coercion.py \
          test/test_torch_context_conversion.py \
          test/test_torch_ops.py \
          test/test_torch_batched_fft.py \
          test/test_torch_p1200087_psd.py \
          test/test_torch_timeseries_at_time.py \
          test/test_torch_versioned_data_psd.py \
          test/test_torch_psd_protocol.py \
          test/test_cpu_batch_peaks.py \
          test/test_torch_cpu_native_batch.py \
          test/test_torch_search_kernels.py \
          test/test_chisq_torch.py \
          test/test_torch_chisq_cpu_optimization.py \
          test/test_torch_chisq_sparse_dispatch.py \
          test/test_torch_filter_pipeline.py \
          test/test_torch_matchedfilter_cpu_optimization.py \
          test/test_live_batch_torch_fft_integration.py \
          test/test_live_batch_torch_peaks.py \
          test/test_matched_filter_symm.py \
          test/test_nltides_torch.py \
          test/test_spatmplt_torch.py \
          test/test_decompress.py \
          test/waveform/test_spa_tmplt_sequence_torch.py \
          test/waveform/test_spherical_harmonics_torch.py \
          test/waveform/test_torch_waveform_registry.py \
          test/waveform/test_torch_ringdown.py \
          test/waveform/test_torch_waveform_modes.py \
          test/waveform/test_torch_waveform_utils.py \
          test/waveform/test_taylorf2_torch.py \
          test/waveform/test_taylorf2ecc_torch.py \
          test/waveform/test_taylorf2nltides_torch.py \
          test/waveform/test_taylorf2redspin_torch.py \
          test/waveform/test_taylorf2_batch.py \
          test/test_torch_domain_compat.py \
          test/test_torch_domain_protocol.py \
          test/test_torch_prior_compat.py \
          test/test_detector_torch_geometry.py \
          test/test_torch_inference_core.py \
          test/test_torch_inference_tools.py \
          test/test_torch_waveform_generator.py \
          test/test_torch_gaussian_noise.py \
          test/test_torch_relative_binning.py \
          test/test_torch_marginalized_gaussian.py \
          test/test_torch_inference_cli.py \
          test/test_torch_performance_artifacts.py
        pixi run -e unittest test-unittest -q \
          test/test_torch_parity_artifacts.py \
          test/test_scheme_selection.py

    - name: check help messages work
      if: matrix.test-type == 'unittest'
      run: |
        export LAL_DATA_PATH=$HOME/lal_aux_data
        pixi run -e help test-help

    - name: run inference tests
      if: matrix.test-type == 'search'
      run: |
        export LAL_DATA_PATH=$HOME/lal_aux_data
        pixi run -e inference test-inference

    - name: store documentation page
      if: matrix.test-type == 'docs' && matrix.python-version == '3.12'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: documentation-page
        path: _gh-pages

  deploy_documentation:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
    - name: retrieve built documentation
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
      with:
        name: documentation-page
    - name: debug
      run: |
        mkdir _gh-pages
        mv latest _gh-pages
    - name: deploying to gh-pages
      uses: JamesIves/github-pages-deploy-action@132898c54c57c7cc6b80eb3a89968de8fc283505 # v3.7.1
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: gh-pages
        FOLDER: _gh-pages
        SINGLE_COMMIT: true
