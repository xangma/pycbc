name: torch gpu (self-hosted)

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Torch scheme to run (e.g., torch:cuda or torch:cuda:1)"
        required: false
        default: "torch:cuda"
      tests:
        description: "Pytest selector (leave blank for unittest suite)"
        required: false
        default: ""

concurrency:
  group: torch-gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  torch-gpu:
    # Requires a self-hosted runner with NVIDIA drivers/CUDA toolkit and the label "gpu"
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps (CPU + torch CUDA wheels assumed available on runner)
        run: |
          python -m pip install --upgrade pip setuptools wheel tox
          # Torch CUDA wheels are assumed preinstalled or available from local cache.
          # Install only if missing to avoid pulling large binaries unexpectedly.
          python - <<'PY'
import importlib, subprocess, sys
try:
    import torch  # noqa: F401
except Exception:
    subprocess.check_call([sys.executable, "-m", "pip", "install", "torch==2.5.1+cu124", "--extra-index-url", "https://download.pytorch.org/whl/cu124"])
PY
      - name: Run torch GPU tests
        env:
          PYCBC_SCHEME: ${{ github.event.inputs.scheme }}
        run: |
          export LAL_DATA_PATH=$HOME/lal_aux_data
          # Default to unittest suite; allow selector override
          if [ -n "${{ github.event.inputs.tests }}" ]; then
            tox -e py-unittest -- ${{ github.event.inputs.tests }}
          else
            tox -e py-unittest
          fi
