name: torch gpu (self-hosted)

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Torch scheme to run (e.g., torch:cuda or torch:cuda:1)"
        required: false
        default: "torch:cuda"
      tests:
        description: "One pytest path or node ID (leave blank for the full suite)"
        required: false
        default: ""

concurrency:
  group: torch-gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  torch-gpu:
    # Requires a self-hosted runner with NVIDIA drivers/CUDA toolkit and the label "gpu"
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runner
        run: |
          python -m pip install --upgrade pip setuptools wheel tox
      - name: Cache LAL auxiliary data files
        id: cache-lal-aux-data
        uses: actions/cache@v4
        with:
          key: lal-aux-data-torch-v2
          path: ~/lal_aux_data
      - if: ${{ steps.cache-lal-aux-data.outputs.cache-hit != 'true' }}
        name: Download LAL auxiliary data files
        run: |
          mkdir -p ~/lal_aux_data
          curl --fail --location --retry 3 --show-error --silent \
            --output-dir ~/lal_aux_data \
            --remote-name https://zenodo.org/records/14999310/files/SEOBNRv4ROM_v2.0.hdf5 \
            --remote-name https://zenodo.org/records/14999310/files/SEOBNRv4ROM_v3.0.hdf5 \
            --remote-name https://zenodo.org/records/14999310/files/SEOBNRv4HMROM_v1.0.hdf5
      - name: Run torch GPU tests
        env:
          PYCBC_TEST_SCHEME: ${{ github.event.inputs.scheme }}
          TEST_SELECTOR: ${{ github.event.inputs.tests }}
        run: |
          export LAL_DATA_PATH=$HOME/lal_aux_data${LAL_DATA_PATH:+:$LAL_DATA_PATH}
          if [ -n "$TEST_SELECTOR" ]; then
            tox -e py-torch -- "$TEST_SELECTOR"
          else
            tox -e py-torch
          fi
