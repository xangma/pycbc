name: torch gpu (self-hosted)

on:
  # Scheduled workflows run the default branch, never untrusted pull-request
  # revisions. Keep self-hosted GPU execution limited to trusted triggers.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      tests:
        description: "One pytest path or node ID; blank runs the CUDA regression set"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: torch-gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  torch-gpu:
    # Requires a self-hosted runner with an NVIDIA GPU and a driver compatible
    # with CUDA 12.6. The PyTorch wheel supplies the CUDA runtime.
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          pixi-version: latest

      - name: Cache LAL auxiliary data files
        id: cache-lal-aux-data
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          key: lal-aux-data
          path: ~/lal_aux_data

      - if: ${{ steps.cache-lal-aux-data.outputs.cache-hit != 'true' }}
        name: Download LAL auxiliary data files
        run: |
          mkdir -p ~/lal_aux_data
          curl --fail --location --retry 3 --show-error --silent \
            --output-dir ~/lal_aux_data \
            --remote-name https://zenodo.org/records/14999310/files/SEOBNRv4ROM_v2.0.hdf5 \
            --remote-name https://zenodo.org/records/14999310/files/SEOBNRv4ROM_v3.0.hdf5

      - name: Run torch GPU tests
        env:
          TEST_SELECTOR: ${{ inputs.tests }}
          PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cu126
          PYTORCH_VERSION: "2.13.0"
        run: |
          export LAL_DATA_PATH=$HOME/lal_aux_data${LAL_DATA_PATH:+:$LAL_DATA_PATH}
          pixi run -e unittest bash -euo pipefail -c '
            python -m ensurepip --upgrade
            python -m pip install --upgrade --force-reinstall \
              "torch==${PYTORCH_VERSION}" \
              --index-url "${PYTORCH_INDEX_URL}"
            python -c "import torch; assert torch.version.cuda == \"12.6\", torch.version.cuda; assert torch.cuda.is_available(); print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name())"
            selectors=(
              test/test_threshold.py
              test/test_chisq.py
              test/test_torch_batched_fft.py
              test/test_live_batch_torch_fft_integration.py
              test/test_live_batch_torch_peaks.py::test_torch_batch_peak_and_threshold_gpu_unit
              test/test_live_batch_torch_peaks.py::test_live_batch_ondevice_peaks_integration
              test/test_torch_cuda_native_batch.py
              test/test_torch_filter_pipeline.py::test_live_batch_matched_filter_cuda_graphs_pipeline
              test/test_torch_performance_artifacts.py
            )
            if [[ -n "${TEST_SELECTOR}" ]]; then
              selectors=("${TEST_SELECTOR}")
            fi
            python -m pytest -q "${selectors[@]}"
          '
